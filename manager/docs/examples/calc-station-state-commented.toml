# 管理端 calc.toml 示例：把站点通信状态用在计算公式中
# 适用版本：RcdManager 0.7.3-state-inputs.1 及支持 state_inputs 的后续版本。
# 编码：UTF-8。以 # 开头的文字都是说明，不参与计算。
#
# 注意：这是教学示例，不是现场完整计算表！
# 不要用本文件直接替换现有计算配置，否则原有规则会从活动配置中删除。
# 推荐：先备份现有配置，再把需要的完整段落追加到现有草稿，校验后激活。
# 本文件供管理端“计算中心”使用，不要放进下级 Rust 程序作为 calc.toml。
# 管理端配置保存在数据库中；仅把这个文件复制到服务器目录不会自动生效。
#
# 先理解两个概念：
#   state_inputs：给一个站点的通信状态起名字，供公式读取。
#   rules：使用这个名字计算结果，并把结果发布给 OPC 客户端。
#
# 例如：
#   来源 real-lower → /dev/ttyWCH0 → 11 号站点
#   给它起名字 EXAMPLE_FIXED_STATE；公式中就直接写 EXAMPLE_FIXED_STATE。
#   不用把 Groups/.../CommunicationState 那条很长的 OPC 路径写进公式。
#
# 一、状态数值的统一含义
#   0 = 状态未知：尚未获取、切换中，或状态快照超过 15 秒未更新。
#   1 = 通信正常。
#   2 = 通信异常：超时、坏帧或尚无有效采集数据等；不是具体硬件故障诊断。
#   3 = 串口未打开。
#   4 = 串口或站点已停用。
#   5 = 下级 OPC 离线。
#
# 这里的 0～5 是“值”，不是 OPC 的质量码。
# 有效的状态判断使用 Good 质量；Good 不等于设备正常。
# 例如下级离线：状态值为 5、质量为 Good，公式可以判断它是否等于 5。
# 不会把离线状态 5 按普通采集值的断线规则清成 0。
# 若来源被删除、站点不存在、缺少默认来源映射等，则报 BadConfigurationError；
# 即使错误输入的数值为 0，也不能当成一个质量正常的“未知状态”。
#
# 二、示例使用的测试环境 ID（来源绑定关系可能调整，以 Web 当前配置为准）
#   real-lower    对应 192.168.10.46 的下级。
#   rcd93-30      对应 192.168.10.30 的下级。
#   rcd92-58      对应 192.168.10.58 的下级。
#   real-hardware 是逻辑组 ID。
# source_id/group_id 填内部 ID，不填 IP、不填显示名称。
# 修改 Web 的显示名称不会改变这些 ID，也不需要同步修改本示例的 ID。
#
# 三、TOML 的括号是什么意思
#   [[state_inputs]]：新建一个状态变量。
#   [[state_inputs.targets]]：给“最近一个状态变量”增加一个来源/站点映射。
#   连续写三个 [[state_inputs.targets]]，表示同一个状态变量有三个映射，
#   不是三个状态变量，也不是把三个来源的状态相加。
#   [[rules]]：新建一条计算规则。每条规则都要重复写这个标题。
# 字段不要写到错误的段落内，例如 group_id 要写在 targets 标题之前。


# -----------------------------------------------------------------------------
# 示例 A：固定来源——始终观察 .46 下级的 WCH0 串口、11 号站点
# -----------------------------------------------------------------------------

[[state_inputs]]
# 公式使用的变量名。这里的名字由你决定，不是设备原有 KKS。
# 使用英文字母、数字、下划线；不能以数字开头，最长 128 字符。
# 不要使用 IF/true/false，不要与其他状态变量、原始点、计算输出重名。
name = "EXAMPLE_FIXED_STATE"

# fixed = 固定来源。切换组默认来源、切换 OPC Session 来源都不会改变它。
# fixed 只能配置一个 targets，并且不要填写 group_id。
mode = "fixed"

[[state_inputs.targets]]
# 选择 .46 下级。若要固定观察 .58，只把这里改成 rcd92-58，
# 同时确认该来源确实有下面的串口和站点。
source_id = "real-lower"

# 串口填写原始名称。这里直接写 /dev/ttyWCH0，不写 %2Fdev%2FttyWCH0。
port_id = "/dev/ttyWCH0"

# 站点填写拓扑中的设备 ID。字段是字符串，所以 11 也要加引号。
# 这不是站点的显示名称，也不是把设备地址写成十六进制字符串。
device_id = "11"


# -----------------------------------------------------------------------------
# 示例 B：跟随组默认来源——观察“当前默认下级”对应的站点
# -----------------------------------------------------------------------------

[[state_inputs]]
name = "EXAMPLE_DEFAULT_STATE"

# group_default = 使用该逻辑组的全局默认来源。
# 不是使用某个 OPC 客户端 Session 自己选择的来源。
# 所有 OPC 客户端看到同一份中央计算结果。
mode = "group_default"

# 填逻辑组 ID，不填显示名称。此模式必须填写 group_id。
group_id = "real-hardware"

# 默认来源是 real-lower 时，读取下面这个站点。
[[state_inputs.targets]]
source_id = "real-lower"
port_id = "/dev/ttyWCH0"
device_id = "11"

# 默认来源是 rcd93-30 时，读取下面这个站点。
[[state_inputs.targets]]
source_id = "rcd93-30"
port_id = "/dev/ttyWCH0"
device_id = "11"

# 默认来源是 rcd92-58 时，读取下面这个站点。
[[state_inputs.targets]]
source_id = "rcd92-58"
port_id = "/dev/ttyWCH0"
device_id = "11"

# 上面三组映射允许串口名、站号不同，只要它们确实是同一逻辑位置的设备，
# 且目标站点属于 real-hardware 组即可；不能仅凭相同站号就认定是同一设备。
# 该组每个候选来源都必须有映射，不能只填写当前默认的那个。
# 以后向组内新增来源，还需为它补齐映射再校验、激活。
# 默认来源离线不会自动改用另一个来源，本状态值将变为 5。


# -----------------------------------------------------------------------------
# 计算规则 1：直接输出固定来源的状态数值，供 Web 和 OPC 客户端查看
# -----------------------------------------------------------------------------

[[rules]]
# 这是最终输出点名称，与上面的输入变量名不同。
# 激活后 OPC 节点为 ns=2;s=EXAMPLE_FIXED_STATE_OUT，是只读的 UInt32。
# 状态输入别名 EXAMPLE_FIXED_STATE 本身不会自动新增一个 ns=2 业务点。
kks_calc = "EXAMPLE_FIXED_STATE_OUT"

# UInt32 是无符号整数，适合表示 0～5 的状态。
data_type = "UInt32"

# 表达式只写一个变量名，意思是原样输出这个变量的值。
expression = "EXAMPLE_FIXED_STATE"

# 以下三个字段可省略；这里写出来是为了说明用途。
# min_limit/max_limit 是结果限幅，不是报警阈值；超出范围会限制在边界值。
# 状态输出必须能容纳 0～5，不要把 max_limit 写成 1。
min_limit = 0
max_limit = 5

# 求值出现运行错误时使用的默认数值，不是正常运行时的固定值。
# 默认数值不会把错误质量改成 Good，也不会覆盖正常的离线状态值 5。
default_value = 0


# -----------------------------------------------------------------------------
# 计算规则 2：固定来源站点“非正常”报警——正常为 0，其他状态为 1
# -----------------------------------------------------------------------------

[[rules]]
kks_calc = "EXAMPLE_FIXED_ALARM"
data_type = "UInt32"

# IF(条件, 条件成立时的值, 条件不成立时的值)。
# == 是“是否相等”，不是赋值。
# 解释：若状态等于 1（通信正常），输出 0；否则输出 1。
# 这条规则会把未知、通信异常、串口未开、已停用、下级离线都算作报警。
# 如现场不希望“主动停用”报警，应按实际业务另写条件。
expression = "IF(EXAMPLE_FIXED_STATE == 1, 0, 1)"
min_limit = 0
max_limit = 1
default_value = 0


# -----------------------------------------------------------------------------
# 计算规则 3：输出当前组默认来源的站点状态
# -----------------------------------------------------------------------------

[[rules]]
kks_calc = "EXAMPLE_DEFAULT_STATE_OUT"
data_type = "UInt32"
expression = "EXAMPLE_DEFAULT_STATE"
min_limit = 0
max_limit = 5
default_value = 0

# 举例：默认来源为 real-lower，取 .46 的状态；
# 在 Web 把组默认来源改成 rcd92-58 后，改取 .58 的状态。
# 但某个 OPC 客户端修改 SelectedSourceId，不会改变这条计算规则的取数目标。


# -----------------------------------------------------------------------------
# 计算规则 4：只判断当前默认来源的下级 OPC 是否离线
# -----------------------------------------------------------------------------

[[rules]]
kks_calc = "EXAMPLE_DEFAULT_LOWER_OFFLINE"
data_type = "UInt32"

# 只有状态为 5 才输出 1。状态 0/1/2/3/4 都输出 0。
# 所以输出 0 仅表示“没有判断为下级离线”，不等于站点通信正常。
expression = "IF(EXAMPLE_DEFAULT_STATE == 5, 1, 0)"
min_limit = 0
max_limit = 1
default_value = 0


# -----------------------------------------------------------------------------
# 应用前检查和操作步骤
# -----------------------------------------------------------------------------
# 1. 在 Web“计算中心 → 规则配置”备份当前完整文本。
# 2. 把需要的 state_inputs 段和 rules 段追加到现有完整草稿；不要清空旧规则。
#    如果只想观察固定来源，仅复制示例 A 和计算规则 1/2 即可。
#    如果只想跟随默认来源，仅复制示例 B 和计算规则 3/4 即可。
# 3. 调整别名、输出名称及来源/组/串口/站点 ID，避免和现有配置重名。
# 4. 保存草稿、校验，确认没有缺少映射、站点不存在或输出重名等错误。
# 5. 激活后，在“状态输入 → 当前生效”核对实际来源和状态；
#    在“实时结果”搜索 EXAMPLE_，检查上述计算输出。
# 6. OPC 客户端连接管理器 4840，通过 Objects/Devices 浏览输出点，
#    或直接读取 ns=2;s=EXAMPLE_FIXED_STATE_OUT 等输出 NodeId。
#    OPC 客户端需同时检查 Value 和 StatusCode，不要只看数值。
#
# 保存草稿不等于激活；修改示例文件本身也不改变正在运行的计算。
# 不需要更改下级 config.toml，也不需要重启下级采集程序。
#
# 注释保留提示：
# 在“规则配置”文本编辑器中可以阅读这些注释。
# 若使用“状态输入”表单新增/编辑/删除映射，保存时会重新排版 TOML 并移除注释，
# 页面会要求确认。请另外保留本示例和你的带注释原稿。
