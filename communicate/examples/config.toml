# Development example only. No query bytes or business offsets are assumed.
schema_version = 1
instance_id = "communicate-example"
# Relative to this config file, not the process working directory.
points_file = "points.csv"

[opc]
# Loopback and a separate port keep isolated checks away from live services.
bind_ip = "127.0.0.1"
advertised_host = "127.0.0.1"
port = 14842
allow_anonymous_none = true
allow_anonymous_secure = true
trust_client_certificates = true

[[ports]]
id = "example-port"
device = "/dev/rcd-communicate-unassigned"
enabled = false
# These are the old example's parameters, NOT confirmed hardware settings.
baud_rate = 115200
data_bits = 8
parity = "even"
stop_bits = 2
first_byte_timeout_ms = 500
frame_timeout_ms = 1500
write_timeout_ms = 500
late_frame_guard_ms = 100
reconnect_min_ms = 1000
reconnect_max_ms = 30000
max_frame_bytes = 4096
max_payload_bytes = 65535

[[ports.tasks]]
id = "example-task"
enabled = false
protocol = "pending"
# Minimum pause after completing this task, not a catch-up timer.
interval_ms = 1000
