[package]
name = "rcd_communicate"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
description = "Independent serial acquisition gateway with read-only OPC UA publishing"
publish = false

[dependencies]
rcd-config-form = { path = "../crates/rcd-config-form" }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
async-opcua = { version = "=0.19.0", features = ["server"] }
# Opt in only for this independent binary; existing RCD keeps its default path.
async-opcua-server = { version = "=0.19.0", features = ["preserve-source-timestamps"] }
chrono = "0.4"
crc32fast = "1"
csv = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
flexi_logger = "0.29.8"
fs2 = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serialport = { path = "../serialport-rs", default-features = false }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8.19"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
# Reuse the project's StatusValue notification fix. Do not patch Cargo caches.
async-opcua-server = { path = "../vendor/async-opcua-server" }

[profile.dev]
debug = 0

[profile.test]
debug = 0
