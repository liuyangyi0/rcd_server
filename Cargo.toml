[package]
name = "rcd_server"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[dependencies]
rcd-config-form = { path = "crates/rcd-config-form" }
tokio = { version = "1.37.0", features = ["full"] }
tokio-util = { version = "0.7.11", features = ["codec", "rt"] }
bytes = "1.6.0"
serde = { version = "1.0.202", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
bincode = "1.3.3"
futures = "0.3.30"
csv = "1.1"
#serialport = "4.4.0"
#serialport = { git = "https://github.com/YgorSouza/serialport-rs.git", branch = "parity-mark-space"}
serialport = { path = "serialport-rs" }
regex = "1.10.4"
toml = "0.8.19"
toml_edit = "0.22.20"
bounded-vec-deque = "0.1.1"
chrono = "0.4"
async-opcua = { version = "0.19", features = ["server"] }
log = "0.4"
flexi_logger = "0.29.8"
fs2 = "0.4"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

# async-opcua-server 0.19 默认的无过滤器路径只比较 Variant，导致
# `0/Good -> 0/BadNoCommunication` 不会产生数据变更通知。固定项目内补丁，
# 仅补上 OPC UA 默认 StatusValue 语义，避免修改全局 Cargo 缓存。
[patch.crates-io]
async-opcua-server = { path = "vendor/async-opcua-server" }
