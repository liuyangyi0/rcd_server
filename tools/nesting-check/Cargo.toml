[package]
name = "nesting-check"
version = "0.1.0"
edition = "2021"
description = "计算规则 (calc.toml) 引用链深度审查工具"

[dependencies]
eframe = { version = "0.28", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui = "0.28"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
regex = "1"
rfd = "0.14"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
